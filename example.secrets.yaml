# Copy this file to `secrets.yaml` and fill in your own values.
# `secrets.yaml` is git-ignored and must NEVER be committed.
#
# Generate strong random values for the *_password fields. For example:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
# The api encryption key must be a 32-byte base64 value:
#   python -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"
ota_password: "generate-a-random-password"
api_password: "generate-a-base64-32-byte-key"
ap_password: "generate-a-random-password"
