# Open AIR Mini — DIY ventilation controller running ESPHome.
#
# This configuration targets the "Made for ESPHome" program:
#   https://esphome.io/guides/made_for_esphome/
#
# Release workflow:
#   - Bump `substitutions.config_version` and `esphome.project.version` together.
#   - Tag the commit as `open-air-mini/v<version>` (the slug before /v must
#     match the filename / devices.yaml slug).
#   - CI validates, builds, publishes the manifest under /open-air-mini/ on
#     GitHub Pages, and attaches binaries to a GitHub Release. Fielded
#     devices poll the manifest every 6h and surface a "Firmware Update"
#     entity in Home Assistant / the web UI.
---
substitutions:
  config_version: "1.0.0" # keep in sync with esphome.project.version below
esphome:
  name: "open-air-mini"
  friendly_name: "Open AIR Mini"
  # Allows a single firmware to be flashed to many physical devices —
  # each gets a unique hostname / entity-id suffix derived from its MAC.
  name_add_mac_suffix: true
  # `project.name` must be globally unique and stable: devices key on it
  # for update checks and Home Assistant adoption. Reverse-domain style
  # plus the device slug avoids collisions between products.
  project:
    name: "luukvisser.open-air-mini"
    version: "1.0.0"
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
api:
  # Ventilation must keep running when Home Assistant is unreachable;
  # disable the API reboot-on-no-client watchdog so a HA outage doesn't
  # cycle the controller. Disconnected mode handles the fan in the gap.
  reboot_timeout: 0s
  # Event-driven disconnected-mode handling: react the moment the API
  # client drops or returns, rather than polling on an interval.
  on_client_disconnected:
    then:
      - logger.log: "API disconnected — entering disconnected mode"
      - script.execute: disconnected_mode
  on_client_connected:
    then:
      - logger.log: "API connected — leaving disconnected mode"
      - script.stop: disconnected_mode
ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request
http_request:
  id: http_request_client
  timeout: 10s
  buffer_size_rx: 2048
update:
  - platform: http_request
    id: firmware_update
    name: "Firmware Update"
    # Per-device manifest URL — must match the Pages path the release
    # workflow publishes to (site/<slug>/manifest.json).
    source: "https://luukvisser.github.io/open-air-mini/open-air-mini/manifest.json"
    update_interval: 6h
    entity_category: diagnostic
wifi:
  id: wifi_client
  # Fallback hotspot (captive portal) in case wifi connection fails.
  ap:
    ssid: "Open AIR Mini"
    password: "cleanair"
    ap_timeout: 90s
captive_portal:
  id: captive_portal_web
# Wi-Fi provisioning over BLE and serial — required by Made-for-ESPHome.
esp32_improv:
  id: improv_ble
  authorizer: none
improv_serial:
  id: improv_serial_provisioner
dashboard_import:
  # The @main ref means users always adopt the latest version of the
  # config from the default branch; switch to a tag (e.g.
  # @open-air-mini/v1.0.0) if you want adoption pinned to a release.
  package_import_url: "github://luukvisser/open-air-mini/open-air-mini.yaml@main"
  import_full_config: false
web_server:
  id: web_server_ui
  port: 80
  version: 3
button:
  - platform: safe_mode
    id: safe_mode_button
    name: "Safe Mode Boot"
    entity_category: diagnostic
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: diagnostic
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
# Globals below are only consumed by disconnected-mode-with-humidity.yaml.
# Uncomment them together with the corresponding `!include` at the bottom.
# globals:
#   - id: disconnected_max_fan_speed
#     type: int
#     restore_value: no
#     initial_value: "100"
#   - id: disconnected_medium_fan_speed
#     type: int
#     restore_value: no
#     initial_value: "60"
#   - id: disconnected_hum_level_max_speed
#     type: int
#     restore_value: no
#     initial_value: "75"
#   - id: disconnected_hum_level_medium_speed
#     type: int
#     restore_value: no
#     initial_value: "55"
# Sensor bus pin assignments for the Open AIR Mini board.
# Uncomment the bus(es) you need when wiring an I²C or UART add-on sensor
# (humidity, CO₂, etc.). From V1.4.0 the sensor pins are swapped; the
# mapping below is correct for v1.4.0+. For boards <1.4.0 swap the pin
# pairs (Sensor 1 ↔ Sensor 2).
# uart:
#   - id: uart_sensor_2
#     rx_pin: GPIO13
#     tx_pin: GPIO12
#     baud_rate: 9600
#   - id: uart_sensor_1
#     rx_pin: GPIO25
#     tx_pin: GPIO26
#     baud_rate: 9600
# i2c:
#   - id: i2c_sensor_2
#     sda: GPIO19
#     scl: GPIO18
#     scan: false
#     frequency: 400kHz
#   - id: i2c_sensor_1
#     sda: GPIO16
#     scl: GPIO4
#     scan: false
#     frequency: 400kHz
status_led:
  id: status_led_indicator
  pin:
    number: GPIO33
# PWM control signal to the EBM-Papst R3G190-RC05-20 EC fan.
# - frequency: 1 kHz per the EBM-Papst RC05 PWM input spec (~1 kHz
#   typical; ultrasonic frequencies are out of range for this input).
# - inverted: true: the fan's PWM input is fail-safe — signal low /
#   loss-of-signal commands maximum speed, so we invert so HA's 100%
#   maps to full speed.
output:
  - platform: ledc
    pin: GPIO15
    frequency: 1000Hz
    inverted: true
    # Below 12% duty the EC fan sits in its internal deadband; clamp
    # the controller-side floor and treat 0 as a true stop.
    min_power: 0.12 
    zero_means_zero: true    
    id: open_air_mini
fan:
  - platform: speed
    output: open_air_mini
    name: "Open AIR Mini"
    id: fan_motor

    # Ventilation should resume after a power blip even if HA is slow
    # to push the prior state back.
    restore_mode: RESTORE_DEFAULT_ON
sensor:
  - platform: pulse_counter
    pin: GPIO14
    unit_of_measurement: 'RPM'
    name: 'AIR Mini RPM'
    accuracy_decimals: 0
    device_class: ""
    id: open_air_mini_rpm
    update_interval: 5s
  - platform: copy
    source_id: open_air_mini_rpm
    name: "Fan Speed"
    id: open_air_mini_rpm_percent
    unit_of_measurement: '%'
    accuracy_decimals: 0
    device_class: ""
    filters:
      - lambda: return x / id(max_fan_rpm).state * 100.0;
      - clamp:
          min_value: 0
          max_value: 100
  - platform: uptime
    name: "Uptime"
    id: device_uptime
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    id: esp32_internal_temperature
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""
# Disconnected Mode Default Fan Speed, for humidities lower than
# Disconnected Hum Level Medium Speed or if NOT using a humidity sensor.
# Without sensor this speed is maintained until a connection to Home
# Assistant has been restored and your automations can take over.
# Exposed as a number entity so it can be tuned from the ESPHome web
# server / Home Assistant; the value persists across reboots.
number:
  - platform: template
    id: disconnected_default_fan_speed
    name: "Disconnected Default Fan Speed"
    icon: "mdi:fan"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    initial_value: 25
    restore_value: true
    optimistic: true
    mode: slider
    entity_category: config
  # Maximum fan RPM, used to convert measured RPM into a percentage.
  # Exposed so it can be calibrated per unit from the ESPHome web server
  # / Home Assistant; the value persists across reboots.
  - platform: template
    id: max_fan_rpm
    name: "Max Fan RPM"
    icon: "mdi:speedometer"
    min_value: 500
    max_value: 10000
    step: 50
    unit_of_measurement: "RPM"
    initial_value: 3400
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
script: !include disconnected-mode-without-humidity.yaml
# !include disconnected-mode-with-humidity.yaml

# The two disconnected-mode includes are mutually exclusive — only one at a time.
