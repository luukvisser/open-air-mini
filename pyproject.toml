[project]
name = "open-air-mini-firmware"
version = "0.0.0"
description = "ESPHome firmware build pipeline for the Open AIR Mini (Made for ESPHome)."
readme = "README.md"
requires-python = ">=3.11,<3.15"

# ESPHome is the one required runtime dep for building firmware. Pinning
# with `==` ensures reproducible builds across CI and local runs. Bump
# deliberately after verifying a new release compiles every device in
# devices.yaml.
dependencies = [
    "esphome==2026.6.4",
    # Used by scripts/ to parse devices.yaml and build the landing page.
    "pyyaml==6.0.3",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Ships YAML + workflows + scripts, not an importable package.
py-modules = []
